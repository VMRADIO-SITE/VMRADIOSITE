name: Relier bouton demande musique

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corriger le bouton sous Notre programme musical
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Le bouton doit déjà être présent sous le sous-titre.
          if 'id="vmRequestHomeButtonStatic"' not in s:
              raise SystemExit('Bouton vmRequestHomeButtonStatic introuvable dans index.html')

          old = '''function openRequests(){
              var modal=document.getElementById('vmRequestModal');
              if(modal){ modal.classList.add('open'); return; }
              loadUi();
              var tries=0;
              var timer=setInterval(function(){
                var m=document.getElementById('vmRequestModal');
                if(m){ clearInterval(timer); m.classList.add('open'); var q=m.querySelector('#vmreqSearch'); if(q) q.focus(); }
                else if(++tries>40){ clearInterval(timer); }
              },100);
            }'''

          new = '''function openRequests(){
              if(typeof window.VMRADIO_OPEN_REQUEST_CATALOG==='function'){
                window.VMRADIO_OPEN_REQUEST_CATALOG();
                return;
              }
              loadUi();
              var tries=0;
              var timer=setInterval(function(){
                if(typeof window.VMRADIO_OPEN_REQUEST_CATALOG==='function'){
                  clearInterval(timer);
                  window.VMRADIO_OPEN_REQUEST_CATALOG();
                } else if(++tries>60){
                  clearInterval(timer);
                  console.error('VM RADIO: catalogue de demandes non initialisé');
                }
              },100);
            }'''

          if old in s:
              s = s.replace(old, new, 1)
          elif 'window.VMRADIO_OPEN_REQUEST_CATALOG();' not in s:
              raise SystemExit('Ancien contrôleur du bouton introuvable')

          # Forcer la dernière version du module pour éviter un cache ancien.
          s = s.replace("music-requests-ui.js?v=20260826-8", "music-requests-ui.js?v=20260826-10")
          s = s.replace("music-requests-ui.js?v=20260826-9", "music-requests-ui.js?v=20260826-10")

          p.write_text(s, encoding='utf-8')
          print('Bouton sous Notre programme musical relié à VMRADIO_OPEN_REQUEST_CATALOG')
          PY

      - name: Commit de index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Relie le bouton programme au catalogue"
          git push
