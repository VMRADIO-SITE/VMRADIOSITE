name: Ajouter bouton demande musique

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajouter le bouton directement dans index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="vmRequestHomeButtonStatic"' in s:
              print('Bouton déjà présent dans index.html')
              raise SystemExit(0)

          target = '<p class="homepage-program-subtitle">Retrouvez notre programme en temps réel !</p><div aria-hidden="true" class="homepage-program-space"></div>'

          replacement = '''<p class="homepage-program-subtitle">Retrouvez notre programme en temps réel !</p>
<div id="vmRequestHomeButton" class="vm-request-home-wrap">
<button id="vmRequestHomeButtonStatic" class="vm-request-home-button" type="button">♫ DEMANDE DE MUSIQUE</button>
</div>
<div aria-hidden="true" class="homepage-program-space"></div>'''

          if target not in s:
              raise SystemExit('Sous-titre programme introuvable dans index.html')

          s = s.replace(target, replacement, 1)

          css = '''
<style id="vmradio-request-home-static">
.vm-request-home-wrap{display:flex!important;justify-content:center!important;align-items:center!important;width:100%!important;margin:14px 0 8px!important}
.vm-request-home-button{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;min-width:270px!important;max-width:100%!important;padding:12px 22px!important;border:1px solid #b85cff!important;border-radius:11px!important;background:linear-gradient(135deg,#170b25,#0b0711)!important;color:#fff!important;font:800 13px/1.1 Arial,sans-serif!important;letter-spacing:.25px!important;cursor:pointer!important;box-shadow:0 0 18px rgba(184,92,255,.18)!important}
.vm-request-home-button:hover{color:#dc9cff!important;box-shadow:0 0 26px rgba(184,92,255,.32)!important}
@media(max-width:700px){.vm-request-home-wrap{margin:10px 0 6px!important}.vm-request-home-button{min-width:0!important;width:min(100%,250px)!important;padding:10px 14px!important;font-size:10px!important;border-radius:9px!important}}
</style>
<script id="vmradio-request-home-static-controller">
(function(){
  'use strict';
  function loadUi(){
    if(window.__VMRADIO_REQUEST_UI__ || document.querySelector('script[data-vm-request-ui-static]')) return;
    var s=document.createElement('script');
    s.src='music-requests-ui.js?v=20260826-8';
    s.dataset.vmRequestUiStatic='1';
    document.head.appendChild(s);
  }
  function openRequests(){
    var modal=document.getElementById('vmRequestModal');
    if(modal){ modal.classList.add('open'); return; }
    loadUi();
    var tries=0;
    var timer=setInterval(function(){
      var m=document.getElementById('vmRequestModal');
      if(m){ clearInterval(timer); m.classList.add('open'); var q=m.querySelector('#vmreqSearch'); if(q) q.focus(); }
      else if(++tries>40){ clearInterval(timer); }
    },100);
  }
  function bind(){
    var b=document.getElementById('vmRequestHomeButtonStatic');
    if(!b || b.dataset.vmBound==='1') return;
    b.dataset.vmBound='1';
    b.addEventListener('click',openRequests);
    loadUi();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind,{once:true}); else bind();
  window.addEventListener('vmradio:pagechange',function(){setTimeout(bind,0)});
})();
</script>
'''

          if '</head>' not in s:
              raise SystemExit('</head> introuvable dans index.html')
          s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          print('Bouton statique ajouté directement dans index.html')

      - name: Commit de index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place Demande de musique sous le programme"
          git push
