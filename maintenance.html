<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0711">
<meta name="robots" content="noindex,nofollow">
<title>VM RADIO — Maintenance</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08060d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(132,56,214,.28),transparent 34%),linear-gradient(180deg,#12091d 0%,#08060d 70%)}
.card{width:min(100%,620px);padding:38px 30px;border:1px solid rgba(196,119,243,.34);border-radius:28px;background:rgba(18,11,28,.94);box-shadow:0 30px 100px rgba(0,0,0,.48);text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid rgba(196,119,243,.3);border-radius:999px;background:rgba(184,92,255,.08);color:#d9a7ff;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.icon{font-size:48px;margin:20px 0 10px}
h1{margin:0;font-size:34px;line-height:1.1}
p{margin:14px auto 0;max-width:470px;color:#d3c8dc;font-size:15px;line-height:1.65}
.note{margin-top:20px;color:#c477f3;font-size:12px;font-weight:800}
.brand{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#aaa1b4}
.brand strong{color:#fff}
@media(max-width:520px){body{padding:16px}.card{padding:32px 20px;border-radius:24px}.icon{font-size:42px}h1{font-size:28px}p{font-size:14px}}
</style>
</head>
<body>
<main class="card" role="main" aria-labelledby="maintenance-title">
  <div class="badge">VM RADIO</div>
  <div class="icon" aria-hidden="true">🛠️</div>
  <h1 id="maintenance-title">Maintenance en cours</h1>
  <p>Le site VM RADIO est temporairement indisponible pendant une intervention technique.</p>
  <p>Merci de votre patience. Le site sera de nouveau accessible dès la fin de la maintenance.</p>
  <div class="note">Nous revenons très vite.</div>
  <div class="brand"><strong>VM RADIO</strong> · Feel the sound, Feel alive</div>
</main>
</body>
</html>
