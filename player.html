<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VM RADIO — Player</title>
<style>

*{box-sizing:border-box}
:root{
  --bg:#07040d;
  --panel:#100a19;
  --panel2:#170d23;
  --violet:#8f2cff;
  --violet2:#c14cff;
  --text:#fff;
  --muted:#a9a1b2;
  --line:rgba(255,255,255,.09);
}
html,body{margin:0;min-height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden!important;scrollbar-width:none!important} html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
body{display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden!important}
.radio-player{
  position:relative;width:min(1220px,100%);overflow:hidden;
  background:
    radial-gradient(circle at 12% 10%,rgba(148,38,255,.22),transparent 34%),
    radial-gradient(circle at 90% 90%,rgba(91,22,173,.18),transparent 34%),
    linear-gradient(135deg,#09050f,#13091d 55%,#08040d);
  border:1px solid rgba(177,89,255,.25);
  border-radius:30px;
  box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 60px rgba(116,31,255,.12);
  transition:.3s ease;
}
.radio-player:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.025) 50%,transparent 75%);
}
.player-inner{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;padding:28px}
.current-section{display:flex;gap:24px;align-items:center}
.cover-wrap{position:relative;flex:0 0 250px;aspect-ratio:1;border-radius:22px;padding:1px;background:linear-gradient(135deg,var(--violet2),#38106e 55%,#12061d);box-shadow:0 0 35px rgba(142,44,255,.25)}
.cover-wrap img{width:100%;height:100%;display:block;object-fit:cover;border-radius:21px;background:#160d20}
.live-dot{position:absolute;top:14px;left:14px;padding:7px 10px;border-radius:999px;background:rgba(7,4,13,.8);border:1px solid rgba(255,255,255,.13);font-size:10px;font-weight:800;letter-spacing:1.4px}
.live-dot:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#c14cff;margin-right:6px;box-shadow:0 0 10px #c14cff}
.track-info{min-width:0}
.eyebrow{font-size:11px;letter-spacing:2px;color:#b99ccf;font-weight:800;margin-bottom:9px}
h1,h2,p{margin:0}
.current-title{font-size:30px;line-height:1.04;font-weight:900;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.current-artist{margin-top:10px;color:var(--muted);font-size:17px}
.meta-row{display:flex;align-items:center;gap:10px;margin-top:18px;color:#c8bed1;font-size:13px}
.meta-row strong{color:#fff}
.controls{display:flex;align-items:center;gap:13px;margin-top:25px}
.control-btn,.heart-btn,
.control-btn:hover,.heart-btn:hover,.close-btn:hover{transform:translateY(-2px);background:rgba(151,45,255,.18);border-color:rgba(193,76,255,.45)}
.play-btn{width:58px;height:58px;background:linear-gradient(135deg,#a83dff,#6520b9);border:0;box-shadow:0 0 28px rgba(163,55,255,.35)}
.play-btn svg{width:22px;height:22px;fill:#fff}
.heart-btn{font-size:21px}.heart-btn.liked{color:#ff72db;box-shadow:0 0 20px rgba(255,72,219,.2)}
.volume{width:120px;accent-color:#a83dff}
.status{margin-top:14px;font-size:10px;letter-spacing:1.5px;color:#927fa1;font-weight:800}
.next-section{
  border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;justify-content:center;min-width:0
}
.next-label{font-size:11px;letter-spacing:2px;color:#a98cbf;font-weight:900;margin-bottom:13px}
.next-card{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.next-card img{width:112px;height:112px;border-radius:17px;object-fit:cover;background:#170d22;border:1px solid rgba(255,255,255,.08)}
.next-title{font-size:24px;line-height:1.06;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.next-artist{margin-top:8px;color:var(--muted);font-size:14px}
.next-time{margin-top:15px;color:#d9c9e4;font-size:12px;font-weight:800}
.divider{height:1px;background:var(--line);margin:23px 0}
.next-note{font-size:11px;color:#80728b;line-height:1.5}

.player-hidden{transform:translateY(25px) scale(.98);opacity:0;pointer-events:none}
.reopen{
  position:fixed;right:22px;bottom:22px;width:54px;height:54px;border-radius:50%;
  border:1px solid rgba(193,76,255,.5);background:#150a20;color:#fff;display:grid;place-items:center;
  box-shadow:0 0 30px rgba(145,40,255,.25);cursor:pointer;opacity:0;pointer-events:none;transform:scale(.8);transition:.25s
}
.reopen-visible{opacity:1;pointer-events:auto;transform:scale(1)}
</style>

<style id="vm-live-indicator-style">
.vm-live-indicator{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin:0 0 12px;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}
.vm-live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff3b4f;
  box-shadow:0 0 8px rgba(255,59,79,.65);
  animation:vmLiveBlink 1s ease-in-out infinite;
  flex:0 0 8px;
}
@keyframes vmLiveBlink{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.25;transform:scale(.78);}
}
@media(max-width:760px){
  .vm-live-indicator{font-size:10px;letter-spacing:1.5px;margin-bottom:9px}

</style>

<style id="vm-player-sync-bar-style">
.vm-player-sync-bar{
  position:relative;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:16px;
  min-height:58px;
  margin:0 28px 22px;
  padding:0 16px;
  border:1px solid rgba(177,89,255,.20);
  border-radius:14px;
  background:rgba(7,4,13,.48);
  color:#c9c0d2;
  font-size:13px;
  line-height:1;
}
.vm-player-sync-left{
  display:flex;
  align-items:center;
  gap:9px;
  justify-content:flex-start;
  min-width:0;
  white-space:nowrap;
}
.vm-player-sync-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#31d17b;
  box-shadow:0 0 9px rgba(49,209,123,.45);
  flex:0 0 9px;
}
.vm-player-sync-zone{
  text-align:center;
  white-space:nowrap;
  color:#d7cfdf;
}
.vm-player-sync-time{
  justify-self:end;
  text-align:right;
  white-space:nowrap;
  color:#d7cfdf;
  font-variant-numeric:tabular-nums;
}
@media(max-width:760px){
  .vm-player-sync-bar{
    grid-template-columns:1fr auto;
    grid-template-areas:
      "left time"
      "zone zone";
    gap:7px 12px;
    padding:10px 12px;
    min-height:auto;
    margin:0 18px 18px;
    font-size:11px;
  }
  .vm-player-sync-left{grid-area:left}
  .vm-player-sync-zone{
    grid-area:zone;
    text-align:left;
    color:#9f95aa;
    font-size:10px;
  }
  .vm-player-sync-time{
    grid-area:time;
    justify-self:end;
  }
}
</style>

<body>
<section class="radio-player" id="radioPlayer" aria-label="Player VM RADIO">
  <div class="player-inner">
    <div class="current-section">
      <div class="cover-wrap">
        
        <img id="currentCover" data-current-cover alt="Pochette du titre actuel">

<div class="vm-live-indicator" aria-label="En direct">

</div>
<h1 class="current-title" id="currentTitle" data-current-title>Chargement…</h1>

<button class="reopen" id="reopenBtn" aria-label="Rouvrir le player">▶</button>
<audio id="radioAudio" crossorigin="anonymous"></audio>
<script>

const CONFIG = {
  currentApi: "https://api.radioking.io/widget/radio/vm-radio2/track/current",
  nextApi: "https://api.radioking.io/widget/radio/vm-radio2/track/next?limit=1",
  // RadioKing listening link supplied for VM RADIO.
  // If your browser does not accept it as an <audio> source, replace it
  // with the MP3/AAC stream shown in RadioKing > Settings > Stream.
  streamUrl: "https://api.radioking.io/radio/917591/listen",
  fallbackCover: "assets/vm-radio-default-cover.jpeg",
  refreshMs: 20000
};

const audio = document.getElementById("radioAudio");
const playBtn = document.getElementById("playBtn");
const playPauseIcon = document.getElementById("playPauseIcon");
const playPausePath = document.getElementById("playPausePath");
const closeBtn = document.getElementById("closeBtn");
const reopenBtn = document.getElementById("reopenBtn");
const volume = document.getElementById("volume");
const currentTitle = document.getElementById("currentTitle");
const currentArtist = document.getElementById("currentArtist");
const currentCover = document.getElementById("currentCover");
const nextTitle = document.getElementById("nextTitle");
const nextArtist = document.getElementById("nextArtist");
const nextCover = document.getElementById("nextCover");
const nextTime = document.getElementById("nextTime");
const broadcastTime = document.getElementById("broadcastTime");
const statusText = document.getElementById("statusText");
const player = document.getElementById("radioPlayer");

if (CONFIG.streamUrl) audio.src = CONFIG.streamUrl;
audio.preload = "auto";

function cleanTitle(value) {
  return String(value || "").trim() || "VM RADIO";
}

function artistForTrack(track) {
  const rawTitle = String(track?.title || "").trim();
  const rawArtist = String(track?.artist || "").trim();
  const isJingle = /\\bjingle\\b|\\bvm\\s*radio\\b|\\bvmradio\\b|\\bid\\s*radio\\b|\\bident\\b/i.test(
    rawTitle + " " + rawArtist
  );
  return isJingle ? "VM RADIO" : "Music IA By Valentin";
}

function setPlaying(playing) {
  // One single SVG icon: it switches between PLAY and PAUSE.
  if (playing) {
    playPausePath.setAttribute("d", "M7 5h4v14H7zm6 0h4v14h-4z");
    playPauseIcon.setAttribute("aria-label", "Pause");
    playBtn.setAttribute("aria-label", "Pause");
  } else {
    playPausePath.setAttribute("d", "M8 5.2v13.6L19 12 8 5.2z");
    playPauseIcon.setAttribute("aria-label", "Lire");
    playBtn.setAttribute("aria-label", "Lire");
  }
  player.classList.toggle("is-playing", playing);
  statusText.textContent = playing ? "EN DIRECT" : "PRÊT À ÉCOUTER";
}

async function togglePlay() {
  if (!CONFIG.streamUrl) {
    statusText.textContent = "FLUX RADIO À CONFIGURER";
    return;
  }
  if (audio.paused) {
    try {
      await audio.play();
      setPlaying(true);
    } catch (err) {
      statusText.textContent = "FLUX INDISPONIBLE";
      console.warn("Lecture du flux impossible", err);
    }
  } else {
    audio.pause();
    setPlaying(false);
  }
}

setPlaying(false);
audio.addEventListener("error", () => {
  statusText.textContent = "FLUX À CONFIGURER";
});

if (volume) {
  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
  });
  audio.volume = 0.85;
}
reopenBtn?.addEventListener("click", () => {
  player.classList.remove("player-hidden");
  reopenBtn.classList.remove("reopen-visible");
});

function formatTime(iso) {
  if (!iso) return "--:--";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "--:--";
  return d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
}

function updateBroadcastTime() {
  broadcastTime.textContent = new Date().toLocaleTimeString("fr-FR", {
    hour: "2-digit", minute: "2-digit"
  });
}

async function loadCurrent() {
  try {
    const res = await fetch(CONFIG.currentApi, {cache: "no-store"});
    if (!res.ok) throw new Error("current " + res.status);

    const track = await res.json();
    if (!track) return;

    currentTitle.textContent = cleanTitle(track.title);
    currentArtist.textContent = artistForTrack(track);

    // Use the real cover supplied by RadioKing for the title currently on air.
    // Only fall back to the station artwork when no current cover is available.
    const cover = track.cover || track.default_cover && CONFIG.fallbackCover;
    if (cover) {
      currentCover.src = cover;
      currentCover.dataset.fallback = "not-used";
    } else if (!currentCover.src || currentCover.dataset.fallback !== "used") {
      currentCover.src = CONFIG.fallbackCover;
      currentCover.dataset.fallback = "used";
    }

    // Keep the displayed broadcast time aligned with the actual track start.
    if (track.started_at) {
      broadcastTime.textContent = formatTime(track.started_at);
    }
  } catch (e) {
    console.warn("Impossible de récupérer le titre actuel.", e);
    if (!currentCover.src || currentCover.dataset.fallback !== "used") {
      currentCover.src = CONFIG.fallbackCover;
      currentCover.dataset.fallback = "used";
    }
  }
}

async function loadNext() {
  try {
    const res = await fetch(CONFIG.nextApi, {cache: "no-store"});
    if (!res.ok) throw new Error("next " + res.status);
    const data = await res.json();
    const track = Array.isArray(data) ? data[0] : data;

    if (!track) return;

    nextTitle.textContent = cleanTitle(track.title);
    nextArtist.textContent = artistForTrack(track);
    nextTime.textContent = formatTime(track.started_at);

    if (track.cover_url) nextCover.src = track.cover_url;
  } catch (e) {
    console.warn("Impossible de récupérer le titre suivant.", e);
  }
}

async function refreshMetadata() {
  await Promise.allSettled([loadCurrent(), loadNext()]);
  updateBroadcastTime();
}

refreshMetadata();
setInterval(refreshMetadata, CONFIG.refreshMs);
setInterval(updateBroadcastTime, 1000);

document.querySelectorAll("[data-heart]").forEach(btn => {
  btn.addEventListener("click", () => btn.classList.toggle("liked"));
});

</script>



<script id="vm-player-clock-final">
(function(){
  "use strict";
  const el=document.getElementById("vmPlayerClock");
  if(!el)return;
  const formatter=new Intl.DateTimeFormat("fr-FR",{
    timeZone:"Europe/Paris",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  });
  function updateClock(){
    const parts=formatter.formatToParts(new Date());
    const h=parts.find(p=>p.type==="hour")?.value||"00";
    const m=parts.find(p=>p.type==="minute")?.value||"00";
    const s=parts.find(p=>p.type==="second")?.value||"00";
    el.textContent=`${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock,1000);
})();
</script>

<script id="vmradio-previous-tracks-bridge">
(function(){
  "use strict";
  function syncPrevious(){
    try{
      const parent=window.parent;
      if(!parent || parent===window)return;
      const root=document.querySelector("[data-previous],[data-player-previous],.previous-tracks,.previous");
      if(!root)return;
      const items=[...root.querySelectorAll("[data-previous-item],.previous-item,.track,.song")];
      const data=items.map(el=>({
        title:(el.querySelector(".title,[data-title]")?.textContent||"").trim(),
        artist:(el.querySelector(".artist,[data-artist]")?.textContent||"").trim(),
        time:(el.querySelector(".time,[data-time]")?.textContent||"").trim(),
        cover:el.querySelector("img")?.getAttribute("src")||""
      })).filter(x=>x.title||x.artist);
      parent.postMessage({type:"vmradio:previous-sync",items:data},"*");
    }catch(e){}
  }
  setTimeout(syncPrevious,500);
  setInterval(syncPrevious,3000);
})();
</script>

<script id="vm-radio-controls-final">
(function(){
  "use strict";

  function init(){
    const audio=document.querySelector("audio");
    const player=document.querySelector(".radio-player,#radioPlayer");
    const close=document.querySelector("#closeBtn,.close-btn,[data-close-player]");
    const reopen=document.querySelector("#reopenBtn,.reopen-btn,[data-reopen-player]");
    const play=document.querySelector("#playBtn,.play-btn,.play,[data-play-player]");

    if(!player) return;

    function notify(type){
      try{ window.parent.postMessage({type:type},"*"); }catch(_){}
    }

    function show(){
      player.classList.remove("player-hidden","is-hidden");
      player.style.display="";
      player.style.visibility="visible";
      player.style.opacity="1";
      player.style.pointerEvents="auto";

      if(reopen){
        reopen.classList.remove("reopen-visible");
        reopen.style.display="none";
      }

      notify("vmradio:player-open");
    }

    function hide(){
      player.classList.add("player-hidden");
      player.style.pointerEvents="none";

      // This internal button is not the reactivation system anymore.
      // The parent page owns the independent reactivation button.
      if(reopen) reopen.style.display="none";

      notify("vmradio:player-close");
    }

    close?.addEventListener("click",function(e){
      e.preventDefault();
      e.stopPropagation();
      hide();
    },true);

    reopen?.addEventListener("click",function(e){
      e.preventDefault();
      e.stopPropagation();
      show();
    },true);

    window.addEventListener("message",function(event){
      if(event.data?.type==="vmradio:force-show"){
        show();
      }
    });

    window.VMRadioPlayer={
      show:show,
      hide:hide,
      play:()=>audio?.play(),
      pause:()=>audio?.pause()
    };
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init,{once:true});
  }else{
    init();
  }
})();
</script>

<script id="vmradio-playback-functionality">
(function(){
  "use strict";
  const audio=document.getElementById("radioAudio");
  const btn=document.getElementById("playBtn");
  const path=document.getElementById("playPausePath");
  const status=document.getElementById("statusText");
  if(!audio || !btn) return;

  const DIRECT="https://api.radioking.io/radio/917591/listen";
  const M3U="https://api.radioking.io/radio/917591/listen.m3u";

  function update(){
    const playing=!audio.paused && !audio.ended;
    if(path) path.setAttribute("d",playing
      ? "M7 5h4v14H7zm6 0h4v14h-4z"
      : "M8 5.2v13.6L19 12 8 5.2z");
    btn.setAttribute("aria-label",playing ? "Mettre en pause" : "Écouter VM RADIO");
    if(status) status.textContent=playing ? "EN DIRECT" : "PRÊT À ÉCOUTER";
  }

  async function getDirectFromM3U(){
    try{
      const r=await fetch(M3U,{cache:"no-store"});
      if(!r.ok) throw new Error("m3u "+r.status);
      const text=await r.text();
      const line=text.split(/\r?\n/).map(x=>x.trim()).find(x=>/^https?:\/\//i.test(x));
      return line || null;
    }catch(_){
      return null;
    }
  }

  async function start(){
    if(!audio.paused){audio.pause();update();return;}
    if(status) status.textContent="CONNEXION…";

    // First try the non-playlist RadioKing endpoint.
    audio.src=DIRECT;
    try{
      await audio.play();
      update();
      return;
    }catch(firstError){}

    // If RadioKing returns a playlist endpoint, resolve the actual stream URL.
    const resolved=await getDirectFromM3U();
    if(resolved){
      audio.src=resolved;
      try{
        await audio.play();
        update();
        return;
      }catch(_){
      }
    }

    if(status) status.textContent="FLUX INDISPONIBLE";
    update();
  }

  btn.addEventListener("click",start);
  audio.addEventListener("play",update);
  audio.addEventListener("playing",update);
  audio.addEventListener("pause",update);
  audio.addEventListener("waiting",()=>{if(status)status.textContent="CONNEXION…";});
  audio.addEventListener("error",()=>{if(status)status.textContent="FLUX INDISPONIBLE";});
  update();
})();
</script>

<script id="vmradio-title-fit-js">
(function(){
  function fit(){
    var el=document.querySelector(".current-title,#currentTitle");
    if(!el)return;
    el.style.fontSize="";
    el.style.transform="none";
    requestAnimationFrame(function(){
      var max=el.clientWidth;
      if(!max)return;
      var size=parseFloat(getComputedStyle(el).fontSize)||32;
      var min=14;
      while(el.scrollWidth>max && size>min){
        size-=1;
        el.style.fontSize=size+"px";
      }
    });
  }
  function init(){
    fit();
    var el=document.querySelector(".current-title,#currentTitle");
    if(el)new MutationObserver(fit).observe(el,{childList:true,characterData:true,subtree:true});
    window.addEventListener("resize",fit);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>

<script id="vmradio-media-session">
(function(){
"use strict";
if(!("mediaSession" in navigator)) return;

const titleEl=document.getElementById("currentTitle");
const artistEl=document.getElementById("currentArtist");
const coverEl=document.getElementById("currentCover");

function updateMediaSession(){
  const title=String(titleEl?.textContent||"").trim();
  const artist=String(artistEl?.textContent||"").trim() || "Music IA By Valentin";
  if(!title || /chargement/i.test(title)) return;

  const artwork=coverEl?.src;
  const data={title:title,artist:artist,album:"VM RADIO"};
  if(artwork && /^https?:/i.test(artwork)){
    data.artwork=[
      {src:artwork,sizes:"96x96",type:"image/jpeg"},
      {src:artwork,sizes:"128x128",type:"image/jpeg"},
      {src:artwork,sizes:"192x192",type:"image/jpeg"},
      {src:artwork,sizes:"256x256",type:"image/jpeg"},
      {src:artwork,sizes:"384x384",type:"image/jpeg"},
      {src:artwork,sizes:"512x512",type:"image/jpeg"}
    ];
  }
  try{ navigator.mediaSession.metadata=new MediaMetadata(data); }catch(e){}
}

function observe(){
  updateMediaSession();
  [titleEl,artistEl,coverEl].forEach(el=>{
    if(!el)return;
    new MutationObserver(updateMediaSession).observe(el,{
      childList:true,characterData:true,attributes:true,subtree:true
    });
  });
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",observe,{once:true});
}else observe();
})();
</script>

<script id="vmradio-default-cover-fallback">
(function(){
  const DEFAULT_COVER="assets/vm-radio-default-cover.jpeg";
  function apply(img){
    if(!img || img.dataset.vmDefaultBound) return;
    img.dataset.vmDefaultBound="1";
    img.addEventListener("error",function(){
      if(this.src && this.src.indexOf(DEFAULT_COVER)===-1) this.src=DEFAULT_COVER;
    },{once:false});
  }
  function scan(){
    document.querySelectorAll('img').forEach(function(img){
      const alt=(img.alt||"").toLowerCase();
      if(/pochette|cover|jaquette/.test(alt)) apply(img);
    });
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",scan,{once:true});
  else scan();
  new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
})();
</script>
