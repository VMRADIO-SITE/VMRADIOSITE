<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VM RADIO — Player</title>
<style>
*{box-sizing:border-box}:root{--bg:#07040d;--violet:#8f2cff;--violet2:#c14cff;--text:#fff;--muted:#a9a1b2;--line:rgba(255,255,255,.09)}html,body{margin:0;width:100%;min-height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:24px}.radio-player{position:relative;width:920px;max-width:100%;overflow:hidden;background:radial-gradient(circle at 12% 10%,rgba(148,38,255,.22),transparent 34%),radial-gradient(circle at 90% 90%,rgba(91,22,173,.18),transparent 34%),linear-gradient(135deg,#09050f,#13091d 55%,#08040d);border:1px solid rgba(177,89,255,.25);border-radius:30px;box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 60px rgba(116,31,255,.12)}.player-inner{display:grid;grid-template-columns:420px minmax(0,1fr);gap:22px;padding:28px}.current-section{display:flex;align-items:center;gap:18px;min-width:0}.cover-wrap{flex:0 0 135px;width:135px;height:135px;border-radius:22px;padding:1px;background:linear-gradient(135deg,var(--violet2),#38106e 55%,#12061d);box-shadow:0 0 35px rgba(142,44,255,.25);overflow:hidden}.cover-wrap img{width:100%;height:100%;display:block;object-fit:cover;border-radius:21px;background:#160d20}.track-info{min-width:0;flex:1}.eyebrow{font-size:11px;letter-spacing:2px;color:#b99ccf;font-weight:800;margin-bottom:8px}.live-indicator{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:10px;font-weight:900;letter-spacing:1.6px}.live-indicator i{width:8px;height:8px;border-radius:50%;background:#ff3b4f;box-shadow:0 0 8px rgba(255,59,79,.65);animation:blink 1s ease-in-out infinite}@keyframes blink{50%{opacity:.28;transform:scale(.8)}}h1,h2,p{margin:0}.current-title{font-size:25px;line-height:1.08;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.current-artist{margin-top:8px;color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta-row{display:flex;align-items:center;gap:8px;margin-top:12px;color:#c8bed1;font-size:12px}.meta-row strong{color:#fff}.controls{display:flex;align-items:center;gap:12px;margin-top:16px}.play-btn,.heart-btn{display:grid;place-items:center;border-radius:50%;cursor:pointer;color:#fff}.play-btn{width:56px;height:56px;border:0;background:linear-gradient(135deg,#a83dff,#6520b9);box-shadow:0 0 28px rgba(163,55,255,.35)}.play-btn svg{width:22px;height:22px;fill:#fff}.heart-btn{width:40px;height:40px;border:1px solid rgba(255,255,255,.12);background:rgba(151,45,255,.08);font-size:20px}.heart-btn.liked,.heart-btn.active{color:#ff72db}.volume{width:105px;accent-color:#a83dff}.status{margin-top:9px;font-size:9px;letter-spacing:1.4px;color:#927fa1;font-weight:800}.next-section{border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;justify-content:center;min-width:0}.next-label{font-size:11px;letter-spacing:2px;color:#a98cbf;font-weight:900;margin-bottom:13px}.next-card{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center;min-width:0}.next-card img{width:88px;height:88px;border-radius:17px;object-fit:cover;background:#170d22;border:1px solid rgba(255,255,255,.08)}.next-title{font-size:22px;line-height:1.06;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-artist{margin-top:7px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-time{margin-top:10px;color:#d9c9e4;font-size:11px;font-weight:800}.next-note{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:#80728b}.syncbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin:0 28px 22px;padding:13px 16px;border:1px solid rgba(177,89,255,.20);border-radius:14px;background:rgba(7,4,13,.48);color:#c9c0d2;font-size:11px}.sync-left{display:flex;align-items:center;gap:8px}.sync-dot{width:8px;height:8px;border-radius:50%;background:#31d17b;box-shadow:0 0 8px rgba(49,209,123,.5)}
</style>
</head>
<body>
<section class="radio-player" id="radioPlayer" aria-label="Player VM RADIO"><div class="player-inner"><div class="current-section"><div class="cover-wrap"><img id="currentCover" data-current-cover alt="Pochette du titre actuel"></div><div class="track-info"><div class="eyebrow">VM RADIO • EN DIRECT</div><div class="live-indicator"><i></i><span>EN DIRECT</span></div><h1 class="current-title" id="currentTitle" data-current-title>Chargement…</h1><p class="current-artist" id="currentArtist" data-current-artist>VM RADIO</p><div class="meta-row"><span>Diffusion</span><strong id="broadcastTime" data-current-time>--:--</strong></div><div class="controls"><button class="play-btn" id="playBtn" type="button" aria-label="Écouter VM RADIO"><svg viewBox="0 0 24 24"><path id="playPausePath" d="M8 5.2v13.6L19 12 8 5.2z"/></svg></button><button class="heart-btn" data-heart type="button" aria-label="J'aime">♥</button><div class="volume-wrap"><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".85" aria-label="Volume"></div></div><div class="status" id="statusText">PRÊT À ÉCOUTER</div></div></div><aside class="next-section"><div class="next-label">TITRE SUIVANT</div><div class="next-card"><img id="nextCover" data-next-cover alt="Pochette du prochain titre"><div><h2 class="next-title" id="nextTitle" data-next-title>Chargement…</h2><p class="next-artist" id="nextArtist" data-next-artist>Artiste</p><div class="next-time">Diffusion prévue à <span id="nextTime" data-next-time>--:--</span></div></div></div><p class="next-note">Données synchronisées directement avec VM RADIO.</p></aside></div><div class="syncbar"><div class="sync-left"><span class="sync-dot"></span><span>Player synchronisé avec VM RADIO</span></div><div id="vmPlayerClock">--:--:--</div></div></section>
<audio id="radioAudio" preload="none" playsinline src="https://radio.vmradio.fr/listen/vm_radio/radio.mp3"></audio>
<script>
window.__VMRADIO_DIRECT_PLAYER__=true;
(function(){
const STREAM='https://radio.vmradio.fr/listen/vm_radio/radio.mp3';
const audio=document.getElementById('radioAudio');const btn=document.getElementById('playBtn');const path=document.getElementById('playPausePath');const status=document.getElementById('statusText');const volume=document.getElementById('volume');
function sync(){const playing=!audio.paused&&!audio.ended;if(path)path.setAttribute('d',playing?'M7 5h4v14H7zm6 0h4v14H13z':'M8 5.2v13.6L19 12 8 5.2z');if(status)status.textContent=playing?'EN DIRECT':'PRÊT À ÉCOUTER';btn.setAttribute('aria-label',playing?'Mettre en pause':'Écouter VM RADIO')}
btn.addEventListener('click',async function(e){e.preventDefault();e.stopPropagation();if(!audio.paused){audio.pause();sync();return}status.textContent='CONNEXION…';try{audio.src=STREAM;audio.load();await audio.play();sync()}catch(err){status.textContent='FLUX INDISPONIBLE';console.error('VM RADIO direct player',err)}});
if(volume){audio.volume=Number(volume.value||.85);volume.addEventListener('input',()=>audio.volume=Number(volume.value))}
audio.addEventListener('play',sync);audio.addEventListener('playing',sync);audio.addEventListener('pause',sync);audio.addEventListener('waiting',()=>status.textContent='CONNEXION…');audio.addEventListener('error',()=>{status.textContent='FLUX INDISPONIBLE';console.error('VM RADIO direct audio error',audio.error?.code,audio.error?.message)});window.VMRadioPlayer={play:()=>audio.play(),pause:()=>audio.pause(),stream:STREAM,audio};sync();
})();
</script>
<script src="vm-radio-flux-central.js?v=20260827-heure2"></script>
<script>(function(){const clock=document.getElementById('vmPlayerClock');const fmt=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});function tick(){if(clock)clock.textContent=fmt.format(new Date())}tick();setInterval(tick,1000);document.querySelector('[data-heart]')?.addEventListener('click',e=>e.currentTarget.classList.toggle('liked'))})();</script>
</body></html>
